name: Build + Release (per commit)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build portable DragShift.exe
        run: pyinstaller DragShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test the build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\DragShift.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }
          "{0:N1} MB portable" -f ((Get-Item dist\DragShift.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/DragShift.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Portable Windows build from commit ${{ github.sha }}.
            Download **DragShift.exe**, double-click it (SmartScreen → More info → Run anyway).
            Built automatically by `release.yml`.
          files: out/*
